<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6f5fd0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<title>誰在用？｜每月存錢計畫</title>
</head>
<body data-page="profiles">

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">💰 存錢計畫</a>
  </div>
</header>

<main class="page narrow">
  <section class="card picker">
    <h1>誰在用？</h1>
    <p class="muted" id="syncStatus"></p>
    <div class="profiles" id="profileGrid"></div>

    <form id="newProfileForm" class="cloud-form" hidden>
      <div class="field"><label for="profileNameInput">新使用者的名字</label><input id="profileNameInput" type="text" maxlength="10" autocomplete="off"></div>
      <div class="actions">
        <button class="btn" type="submit">建立並進入</button>
      </div>
    </form>
  </section>

  <p class="center"><button class="link-btn" id="logoutLink" type="button">登出（換帳號）</button></p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="sync.js"></script>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
