<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6f5fd0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<title>記帳｜每月存錢計畫</title>
</head>
<body data-page="expense">

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">💰 存錢計畫</a>
    <nav class="tabs" aria-label="主要頁面">
      <a href="index.html" data-tab="overview"><span aria-hidden="true">🏠</span>總覽</a>
      <a href="expense.html" data-tab="expense" aria-current="page"><span aria-hidden="true">✏️</span>記帳</a>
      <a href="diary.html" data-tab="diary"><span aria-hidden="true">📔</span>日記</a>
      <a href="history.html" data-tab="history"><span aria-hidden="true">📋</span>明細</a>
      <a href="plan.html" data-tab="plan"><span aria-hidden="true">🌱</span>存錢計畫</a>
      <a href="settings.html" data-tab="settings"><span aria-hidden="true">⚙️</span>設定</a>
    </nav>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <h1>記一筆支出</h1>
    <p>選好日期、金額與類別，按下記錄即可。</p>
  </div>

  <section class="grid expense-layout">
    <form class="card" id="expForm" novalidate>
      <div class="form-grid">
        <div class="field"><label for="expDate">日期</label><input id="expDate" type="date" required></div>
        <div class="field">
          <label for="expAmount">金額</label>
          <div class="amount-row">
            <input id="expAmount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="例如：185" required>
            <select id="expCurrency" aria-label="幣別"></select>
          </div>
        </div>
        <div class="field"><label for="expCategory">類別</label><select id="expCategory"></select></div>
        <div class="field"><label for="expPay">付款方式</label><select id="expPay"></select></div>
      </div>

      <div class="field" id="rateField" hidden>
        <label for="expRate">匯率（1 外幣 ＝ 多少台幣）</label>
        <input id="expRate" type="number" inputmode="decimal" min="0" step="0.0001" placeholder="取得中…">
        <p class="hint" id="fxPreview"></p>
        <p class="hint">匯率來源：<a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates By Exchange Rate API</a>，每日更新，可以手動修改。</p>
      </div>

      <fieldset class="meal-field">
        <legend class="label-s" id="tagLegend">餐別（可複選）</legend>
        <div class="check-chips" id="mealChips"></div>
        <div class="tag-add">
          <input id="tagInput" type="text" maxlength="10" placeholder="自訂細項，例如：洗車">
          <button class="btn ghost" id="tagAdd" type="button">新增</button>
        </div>
      </fieldset>

      <div class="quick">
        <span class="label-s">快速金額</span>
        <div class="chips">
          <button class="chip" type="button" data-amt="50">50</button>
          <button class="chip" type="button" data-amt="100">100</button>
          <button class="chip" type="button" data-amt="150">150</button>
          <button class="chip" type="button" data-amt="200">200</button>
          <button class="chip" type="button" data-amt="300">300</button>
        </div>
      </div>

      <div class="field">
        <label for="expPhotos">紀錄／照片（選填，最多 3 張）</label>
        <input id="expPhotos" type="file" accept="image/*" multiple>
        <div class="thumbs" id="photoPreview"></div>
      </div>

      <div class="field">
        <label for="expNote">心得／想記錄的話（選填）</label>
        <textarea id="expNote" maxlength="500" rows="3" placeholder="例如：這家店很好吃，下次還要再來"></textarea>
      </div>

      <label class="check-row"><input id="expLocation" type="checkbox"> 附上目前位置</label>

      <button class="btn block" type="submit">記錄支出</button>
    </form>

    <aside class="card">
      <h2 id="dayTitle">今天的生活費</h2>
      <div class="row small"><span id="daySpent">—</span><span id="dayRemain">—</span></div>
      <div class="bar"><span id="dayBar"></span></div>
      <p class="muted" id="dayHint"></p>
    </aside>
  </section>

  <section class="card">
    <div class="row">
      <h2>這一天的紀錄</h2>
      <a class="link" href="history.html">查看本月全部 →</a>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>類別</th><th>備註</th><th class="amount">金額</th><th>操作</th></tr></thead>
        <tbody id="dayRows"></tbody>
      </table>
      <div id="dayEmpty" class="empty">這天還沒有紀錄，記下第一筆吧 ✨</div>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="sync.js"></script>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
