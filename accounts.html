<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6f5fd0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<title>帳戶｜每月存錢計畫</title>
</head>
<body data-page="accounts">

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">💰 存錢計畫</a>
    <nav class="tabs" aria-label="主要頁面">
      <a href="index.html" data-tab="overview"><span aria-hidden="true">🏠</span>總覽</a>
      <a href="expense.html" data-tab="expense"><span aria-hidden="true">✏️</span>記帳</a>
      <a href="diary.html" data-tab="diary"><span aria-hidden="true">📔</span>日記</a>
      <a href="history.html" data-tab="history"><span aria-hidden="true">📋</span>明細</a>
      <a href="accounts.html" data-tab="accounts" aria-current="page"><span aria-hidden="true">💳</span>帳戶</a>
      <a href="plan.html" data-tab="plan"><span aria-hidden="true">🌱</span>存錢計畫</a>
      <a href="settings.html" data-tab="settings"><span aria-hidden="true">⚙️</span>設定</a>
    </nav>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <h1>帳戶</h1>
    <p>每個帳戶的餘額會隨記帳自動增減。實際餘額不一樣時，按「更新餘額」輸入正確的金額即可。</p>
  </div>

  <section class="grid g2">
    <div class="card stat">
      <div class="label">總資產</div>
      <div class="value" id="accTotal">—</div>
      <p class="hint">刷卡的消費要等到繳卡費時才會從帳戶扣款，所以不會先從這裡減掉。</p>
    </div>
    <div class="card">
      <h2>各帳戶佔比</h2>
      <svg class="pie" id="accPie" viewBox="0 0 200 200" role="img" aria-label="各帳戶餘額的圓餅圖"></svg>
      <p class="muted" id="accEmpty" hidden>還沒有正數的餘額。按下方的「更新餘額」輸入目前的金額。</p>
      <div class="legend" id="accLegend"></div>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <h2>帳戶餘額</h2>
      <a class="link" href="expense.html">轉帳 →</a>
    </div>
    <div id="accRows"></div>
    <p class="hint">帳戶的增刪改名請到「設定 → 帳戶」。</p>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="sync.js"></script>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
