<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6f5fd0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<title>登入｜每月存錢計畫</title>
</head>
<body data-page="login">

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="login.html">💰 存錢計畫</a>
  </div>
</header>

<main class="page narrow">
  <section class="card picker" id="pickerCard" hidden>
    <h1>誰在用？</h1>
    <div class="profiles" id="profileGrid"></div>
  </section>

  <section class="card" id="loginCard">
    <div class="row">
      <h2>登入</h2>
      <button class="link-btn" id="backToPicker" type="button" hidden>← 返回選擇</button>
    </div>
    <p class="muted" id="syncStatus"></p>
    <form id="loginForm" class="cloud-form" novalidate>
      <div class="field"><label for="loginUser">電子郵件</label><input id="loginUser" type="email" autocomplete="username"></div>
      <div class="field"><label for="loginPass">密碼</label><input id="loginPass" type="password" autocomplete="current-password"></div>
      <button class="btn" type="submit">登入</button>
    </form>
    <p class="center"><button class="link-btn" id="showSignup" type="button">沒有帳號？註冊新帳號</button></p>
  </section>

  <section class="card" id="signupCard" hidden>
    <h2>註冊新帳號</h2>
    <p class="muted">註冊後會看到自己的空白記帳資料，和其他人的資料分開。</p>
    <form id="signupForm" class="cloud-form" novalidate>
      <div class="field"><label for="signupUser">電子郵件</label><input id="signupUser" type="email" autocomplete="username"></div>
      <div class="field"><label for="signupPass">密碼（至少 6 個字）</label><input id="signupPass" type="password" autocomplete="new-password"></div>
      <div class="field"><label for="signupPass2">再輸入一次密碼</label><input id="signupPass2" type="password" autocomplete="new-password"></div>
      <button class="btn" type="submit">註冊</button>
    </form>
    <p class="center"><button class="link-btn" id="backToLogin" type="button">已有帳號？回到登入</button></p>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="sync.js"></script>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
